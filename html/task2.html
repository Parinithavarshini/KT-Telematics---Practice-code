<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">"
        <style>
            .login{
                display: flex;
            }
            .first{
                height: 450px;
                width: 400px;
                background-color: rgb(247, 249, 249);
                text-align: center;
            }
            .second{
                height: 450px;
                width: 400px;
                background-image: url(https://tse3.mm.bing.net/th/id/OIP.sFJv8KBEc6njUxPhb1WV8QHaNK?pid=Api&P=0&h=180);
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
                color: white;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                text-align: center;
            }
            #button{
                border-radius: 15px;
                border-color: white;
                height: 30px;
                width: 90px;
            }
            .submit{
                margin-top: 20px;
            }
        </style>
    </head>
    <body style="background-color: #000000;" class="login">
        <div class="first">
            <h1 style="text-align: center;">Login to Your Account</h1>
            <p>Login using social networks</p>
            <i class="bi bi-facebook"></i>
            <i class="bi bi-google-play" style="margin-left: 20px;"></i>
            <i class="bi bi-linkedin" style="margin-left: 20px;"></i><hr><br><br>
            <input type="email" name="mail" placeholder="Email" autofocus title="Email your email here" style="border-radius: 10px; height: 40px; width: 270px; border:none; border-bottom: 1px solid rgb(25, 169, 209);" class="mail"><br><br>
            <input type="password" name="password" placeholder="Password" title="Email your password here" style="border-radius: 10px; height: 40px; width: 270px; border:none; border-bottom: 1px solid rgb(25, 169, 209)" class="pass">
            <div class="submit">
                <button type="submit" style="border-radius: 10px; height: 40px; width: 200px; border:none; border-bottom: 1px solid rgb(25, 169, 209); background-color: aqua; margin-top: 20px;">Sign In</button>
            </div>
        </div>
        <div class="second">
            <h1 style="margin-top: 150px;">New Here?</h1>
            <p style="margin-top: 30px;">Sign up and discover a great amount of new opportunities!</p>
            <button type="button" id="button">Sign Up</button>
        </div>
    </body>
</html>
