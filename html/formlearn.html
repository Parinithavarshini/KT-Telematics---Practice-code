<!--Form-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width:device-width,initial-scale=1.0">
        <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/023/654/784/non_2x/golden-logo-template-free-png.png">
        <link rel="stylesheet" href="../css/forms.css">
        <script src="../Javascript/advanced.js"></script>
    </head>
    <body>
        <form action="movie.html" method="get" target="_self" autocomplete="off" accept-charset="UTF-8" enctype="multipart/form-data">   <!--novalidate-skips browser validation-->
            <div class="form">
                <h4>ENTER YOUR DETAILS</h4>
                <div>
                    <fieldset>
                        <legend>Name</legend>
                            <label for="fname">First Name</label>
                            <input type="text" name="fname" id="fname" required>
                            <label for="lname">Last Name</label>
                            <input type="text" name="lname" id="lname" required>
                    </fieldset>
                </div><br>
                <input type="hidden" name="id" value="719">
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" size="50" pattern="[a-zA-Z]{6}">
                </div><br>
                <div>
                    <label for="dob">Enter your DOB</label><br>
                    <input type="date" name="dob" id="dob" min="01-01-1900" max="01-01-3000" required>
                </div><br>
                <div>
                    <label for="dtime">Enter your Current date and time</label><br>
                    <input type="datetime-local" name="dtime" id="dtime" required>
                </div><br>
                <div>
                    <label for="time">Enter your current time</label><br>
                    <input type="time" name="time" id="time" required>
                </div><br>
                <div>
                    <label for="month">Enter your Current month</label><br>
                    <input type="month" name="month" id="month" required>
                </div><br>
                <div>
                    <label for="week">Enter your Current week</label><br>
                    <input type="week" name="week" id="week" required>
                </div><br>
                <div>
                    <label>Select your favourite web language</label><br>
                    <input type="radio" checked id="radio1" name="radio" value="HTML">
                    <label for="radio1">HTML</label><br>
                    <input type="radio" id="radio2" name="radio" value="CSS">
                    <label for="radio2">CSS</label><br>
                    <input type="radio" id="radio3" name="radio" value="Javascript">
                    <label for="radio3">Javascript</label>
                </div><br>
                <div>
                    <label for="email">Enter your email</label>
                    <input type="email" id="email" name="email" placeholder="Eg : xyz@gmail.com" required autocomplete="email" readonly>
                </div><br>
                <div>
                    <label>Select the suitable timing</label><br>
                    <input type="checkbox" checked id="check1" name="check" value="08-09">
                    <label for="check1">08.00 am - 09.00 am</label><br>
                    <input type="checkbox" id="check2" name="check2" value="09-10">
                    <label for="check2">09.00 am - 10.00 am</label><br>
                    <input type="checkbox" id="check3" name="check3" value="10-11">
                    <label for="check3">10.00 am - 11.00 am</label>
                </div><br>
                <div>
                    <label>Select suitable browser</label>
                    <input type="text" name="browser" list="browser">
                    <datalist id="browser">
                        <option value="edge"></option>
                        <option value="firefox"></option>
                        <option value="chrome"></option>
                    </datalist>
                </div>
                <div>
                    <label for="state">Select your state</label>
                    <select name="state" id="state" multiple size="4">
                        <optgroup label="South">
                        <option value="Tamilnadu">Tamilnadu</option>
                        <option selected value="Kerala">Kerala</option>
                        <option value="Karnataka">Karnataka</option>
                        </optgroup>
                        <optgroup label="North">
                        <option value="Assam">Assam</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Rajasthan">Rajasthan</option>
                        </optgroup>
                    </select>
                </div><br>
                <div>
                    <label for="phn">Enter Mobile No</label>
                    <input type="tel" name="phn" id="phn" pattern="[0-9]{10}">
                </div><br>
                <div>
                    <label for="code">Enter your country code</label>
                    <input type="text" name="code" id="code" pattern="[A-Za-z]{3}">
                </div><br>
                <div>
                    <label for="url">Enter github link</label>
                    <input type="url" name="url" id="url" required>
                </div><br>
                <div>
                    <label for="message">Enter details about you</label><br>
                    <textarea name="message" id="message" rows="8" cols="25" placeholder="About you" autofocus></textarea>
                </div><br>
                <div>
                    <label for="color">Select your favourite color</label>
                    <input type="color" id="color" name="color">
                </div><br>
                <label>If you click the below image form is submitted</label><br>
                <input type="image" src="../images/Favicon.jpg" disabled alt="img" height="100px" width="100px">
                <div>
                    <label for="file">Upload your photo</label>
                    <input type="file" id="file" name="file" required accept=".png,.jpg" multiple>
                </div><br>
                <div>
                    <label for="count">Count of vehicles</label>
                    <input type="number" name="count" id="count" step="1" value="5" oninput="if(this.value>10) this.value=10">
                </div><br>
                <div>
                    <label for="range">Select range</label>
                    <input type="range" name="range" id="range" min="0" max="40" value="10">
                </div><br>
                <div>
                    <label for="search">Search here</label>
                    <input type="search" name="search" id="search">
                </div><br>
                <div>
                    <label>Form status</label>
                    <progress value="50" max="100"></progress>
                    <meter value="60" min="0" max="100">60%</meter>
                </div>
                <div>
                    <button type="submit" formaction="bootstrap.html">SUBMIT</button>    <!--Formmethod,formtarget,formnovalidate,-->
                    <button type="reset">RESET</button>
                    <button type="button">BUTTON</button>
                </div>
            </div>
        </form>
    </body>
</html>
